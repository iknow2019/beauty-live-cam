<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>뷰티 라이브 캠 v0.5</title><style>body{background:#151622;color:#eee;font:16px system-ui;margin:auto;padding:12px;max-width:720px}h1{font-size:23px}canvas{width:100%;max-height:52vh;object-fit:contain;background:#090910;border-radius:12px}button{background:#363b54;color:white;border:1px solid #777;border-radius:9px;padding:10px;margin:3px}section{background:#24283a;padding:12px;border-radius:12px;margin-top:10px}label{display:flex;align-items:center;gap:8px;margin:12px 0}label span{width:85px}input{flex:1;min-width:0;accent-color:#dc8fcb}output{width:30px;text-align:right}#status{font-size:14px}video{display:none}</style><h1>뷰티 라이브 캠 v0.5</h1><video id="v" autoplay playsinline muted></video><canvas id="out" width="480" height="640"></canvas><div><button id="start">카메라 시작</button><button id="flip">카메라 전환</button><button id="stop">종료</button><button id="photo">사진 저장</button></div><p id="status">카메라 시작을 눌러주세요.</p><section><b>실시간 얼굴 보정</b><div><button data-p="0">원본</button><button data-p="1">자연 보정</button><button data-p="2">여성형</button><button data-p="3">강한 여성형</button><button data-p="4">동안 보정</button><button data-p="5">여성형 + 동안</button></div><div id="controls"></div></section><section><b>마이크 테스트</b><button id="mic">마이크 확인</button><p id="ms">음성 변조 및 방송 연동은 아직 미지원입니다.</p></section><p>얼굴 추적 모델은 외부 CDN에서 내려받습니다. 카메라 영상은 기기 안에서 처리합니다. 얼굴형 보정은 AI 얼굴 교체가 아닌 형태 변형입니다. 얼굴 전체가 화면에 들어오도록 카메라를 조금 멀리 두세요.</p><script type="module">
const softCanvas=document.createElement('canvas');const $=id=>document.getElementById(id),v=$('v'),out=$('out'),ctx=out.getContext('2d'),base=document.createElement('canvas'),bc=base.getContext('2d',{willReadFrequently:true}),settings={},names={strength:'전체 강도',skin:'피부 보정',jaw:'턱선 축소',eyes:'눈 확대',nose:'코 축소',lip:'입술 색상',blush:'볼 화장',light:'밝기',young:'동안 효과'};for(const [k,n] of Object.entries(names)){let l=document.createElement('label');l.innerHTML=`<span>${n}</span><input type="range" min="0" max="100" value="0"><output>0</output>`;let i=l.querySelector('input'),o=l.querySelector('output');settings[k]=i;i.oninput=()=>o.value=i.value;$('controls').append(l)}const presets=[[0,0,0,0,0,0,0,0,0],[65,55,20,15,15,8,5,8,25],[85,75,75,50,55,22,12,10,45],[100,85,95,65,80,28,15,12,65],[100,85,20,12,10,5,4,8,85],[100,85,85,45,60,22,10,10,90]];document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>Object.values(settings).forEach((i,j)=>{i.value=presets[+b.dataset.p][j];i.oninput()}));document.querySelector('[data-p="5"]').click();let stream,face,modelPromise,points,raf=0,facing='user',token=0,last=-1,lastDetect=0;const status=s=>$('status').textContent=s;function model(){return modelPromise??=(async()=>{const {FilesetResolver,FaceLandmarker}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/+esm');const files=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm');return FaceLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'},runningMode:'VIDEO',numFaces:1})})().catch(e=>{modelPromise=null;throw e})}function stop(){token++;cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;points=null;last=-1;ctx.clearRect(0,0,out.width,out.height);status('카메라 종료')}async function start(){stop();const t=token;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPS 주소에서 실행해주세요.');const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:640},height:{ideal:480}},audio:false});if(t!==token){s.getTracks().forEach(x=>x.stop());return}stream=s;v.srcObject=s;await v.play();if(t!==token)return;status('카메라 작동 중 · 얼굴 모델 준비 중');raf=requestAnimationFrame(draw);try{face=await model();if(t===token)status('얼굴 인식 준비 완료')}catch(e){if(t===token)status('얼굴 모델 로딩 실패: '+e.message+' / 카메라 시작을 다시 눌러주세요.')}}catch(e){if(t===token)status('카메라 오류: '+e.message)}}
function draw(now){if(!stream)return;raf=requestAnimationFrame(draw);if(v.readyState<2)return;const scale=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight)),w=Math.round(v.videoWidth*scale),h=Math.round(v.videoHeight*scale);if(out.width!==w||out.height!==h){out.width=base.width=w;out.height=base.height=h}bc.setTransform(facing==='user'?-1:1,0,0,1,facing==='user'?w:0,0);bc.drawImage(v,0,0,w,h);bc.setTransform(1,0,0,1,0,0);if(face&&v.currentTime!==last&&now-lastDetect>65){last=v.currentTime;lastDetect=now;try{const p=face.detectForVideo(v,now).faceLandmarks[0];points=p?p.map((q,i)=>{const x=(facing==='user'?1-q.x:q.x)*w,y=q.y*h;return points?.[i]?{x:points[i].x*.30+x*.70,y:points[i].y*.30+y*.70}:{x,y}}):null;status(points?'카메라 작동 중 · 얼굴 인식 성공':'얼굴을 화면 중앙에 맞춰주세요.')}catch(e){status('얼굴 인식 오류: '+e.message);points=null}}const a=+settings.strength.value/100,f=k=>+settings[k].value/100*a;ctx.filter=`brightness(${1+f('light')*.22})`;ctx.drawImage(base,0,0);ctx.filter='none';if(!points||!a)return;const p=points,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2}),fw=dist(p[234],p[454]),fh=dist(p[10],p[152]);if(fw<15)return;const regions=[[mid(p[33],p[133]),fw*.20,fh*.14,-f('eyes')*.62,1],[mid(p[362],p[263]),fw*.20,fh*.14,-f('eyes')*.62,1],[p[1],fw*.19,fh*.20,f('nose')*.75,.35],[mid(p[152],p[13]),fw*.78,fh*.43,f('jaw')*.40,.06]];
const src=bc.getImageData(0,0,w,h),dst=ctx.getImageData(0,0,w,h),d=dst.data,s=src.data,bright=1+f('light')*.22;
const clamp=(x,m)=>Math.max(0,Math.min(m,x));
function warp(x,y){for(const [c,rx,ry,k,ky] of regions){let dx=x-c.x,dy=y-c.y,r=dx*dx/(rx*rx)+dy*dy/(ry*ry);if(r<1){let z=k*(1-r)**2;x+=dx*z;y+=dy*z*ky}}return [x,y]}
const lipOuter=[61,185,40,39,37,0,267,269,270,409,291,375,321,405,314,17,84,181,91,146],lipInner=[78,191,80,81,82,13,312,311,310,415,308,324,318,402,317,14,87,178,88,95];
function inside(x,y,ids){let yes=false;for(let i=0,j=ids.length-1;i<ids.length;j=i++){let a=p[ids[i]],b=p[ids[j]];if((a.y>y)!=(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)yes=!yes}return yes}
function edge(x,y,ids){let m=1e9;for(let i=0;i<ids.length;i++){let a=p[ids[i]],b=p[ids[(i+1)%ids.length]],dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((x-a.x)*dx+(y-a.y)*dy)/(dx*dx+dy*dy||1)));m=Math.min(m,Math.hypot(x-a.x-t*dx,y-a.y-t*dy))}return m}
const young=f('young'),smooth=f('skin'),lip=f('lip'),blush=f('blush'),cx=(p[234].x+p[454].x)/2,cy=(p[10].y+p[152].y)/2;
const soft=softCanvas;if(soft.width!==w||soft.height!==h){soft.width=w;soft.height=h;}const sc=soft.getContext('2d',{willReadFrequently:true});sc.filter=`blur(${Math.max(1,fw*.027)}px)`;sc.drawImage(base,0,0);const blurred=sc.getImageData(0,0,w,h).data;
const eyeA=mid(p[33],p[133]),eyeB=mid(p[362],p[263]);const gauss=(x,y,q,rx,ry)=>Math.exp(-2*((x-q.x)**2/rx**2+(y-q.y)**2/ry**2));const forehead=mid(p[10],p[168]);const under=[{x:eyeA.x,y:eyeA.y+fh*.095},{x:eyeB.x,y:eyeB.y+fh*.095}];const folds=[mid(p[98],p[61]),mid(p[327],p[291])];
for(let y=Math.max(0,Math.floor(Math.min(p[10].y,p[152].y)-fh*.25));y<Math.min(h,Math.max(p[10].y,p[152].y)+fh*.35);y++)for(let x=Math.max(0,Math.floor(cx-fw*.95));x<Math.min(w,cx+fw*.95);x++){
let [sx,sy]=warp(x,y);sx=clamp(sx,w-1);sy=clamp(sy,h-1);let ix=Math.floor(sx),iy=Math.floor(sy),tx=sx-ix,ty=sy-iy,j=(iy*w+ix)*4,jr=(iy*w+Math.min(w-1,ix+1))*4,jb=(Math.min(h-1,iy+1)*w+ix)*4,jbr=(Math.min(h-1,iy+1)*w+Math.min(w-1,ix+1))*4,i=(y*w+x)*4;
let rgb=[0,1,2].map(c=>(s[j+c]*(1-tx)+s[jr+c]*tx)*(1-ty)+(s[jb+c]*(1-tx)+s[jbr+c]*tx)*ty);
let mask=Math.max(0,1-((sx-cx)/(fw*.49))**2-((sy-cy)/(fh*.49))**2);for(const q of [mid(p[33],p[133]),mid(p[362],p[263]),p[13],p[1]])mask*=Math.min(1,Math.hypot((sx-q.x)/(fw*.12),(sy-q.y)/(fh*.08))**2);
if(smooth*mask>.02){let sum=rgb.slice(),weight=1,step=Math.max(1,Math.round(fw*.012));for(const [dx,dy] of [[step,0],[-step,0],[0,step],[0,-step],[step,step],[-step,-step]]){let k=(clamp(iy+dy,h-1)*w+clamp(ix+dx,w-1))*4,delta=Math.abs(s[k]-rgb[0])+Math.abs(s[k+1]-rgb[1])+Math.abs(s[k+2]-rgb[2]),wt=Math.exp(-delta/65);for(let c=0;c<3;c++)sum[c]+=s[k+c]*wt;weight+=wt}rgb=rgb.map((z,c)=>z+(sum[c]/weight-z)*smooth*mask*.85)}
if(young>0){let foreheadWeight=gauss(sx,sy,forehead,fw*.38,fh*.22),underWeight=Math.max(...under.map(q=>gauss(sx,sy,q,fw*.17,fh*.075))),foldWeight=Math.max(...folds.map(q=>gauss(sx,sy,q,fw*.12,fh*.17)));let protectedMask=1;for(const q of [eyeA,eyeB,p[13],p[1],p[105],p[334]])protectedMask*=Math.min(1,Math.hypot((sx-q.x)/(fw*.12),(sy-q.y)/(fh*.055))**3);let skinMask=Math.min(1,mask*2.1)*protectedMask;let mix=young*skinMask*Math.min(.88,.30+.55*foreheadWeight+.55*underWeight+.45*foldWeight);for(let c=0;c<3;c++)rgb[c]+= (blurred[j+c]-rgb[c])*mix+young*skinMask*(underWeight*13+foldWeight*6);}
let tint=0;if(blush>0)for(const q of [p[50],p[280]])tint+=Math.exp(-3*(((sx-q.x)/(fw*.17))**2+((sy-q.y)/(fh*.11))**2))*blush*.13;
let lt=0;if(lip>0&&Math.abs(sx-p[13].x)<fw*.30&&Math.abs(sy-p[13].y)<fh*.13&&inside(sx,sy,lipOuter)&&!inside(sx,sy,lipInner))lt=lip*.32*Math.min(1,edge(sx,sy,lipOuter)/Math.max(1,fw*.018),edge(sx,sy,lipInner)/Math.max(1,fw*.012));
for(let c=0;c<3;c++)d[i+c]=(rgb[c]+[12,-12,-5][c]*tint*4+[18,-25,-12][c]*lt*3)*bright;
}ctx.putImageData(dst,0,0)}
$('start').onclick=start;$('stop').onclick=stop;$('flip').onclick=()=>{facing=facing==='user'?'environment':'user';start()};$('photo').onclick=()=>{if(!stream)return;out.toBlob(b=>{if(!b)return;const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='beauty-'+Date.now()+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)})};$('mic').onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());$('ms').textContent='마이크 접근 성공 (음성 변조 미지원)'}catch(e){$('ms').textContent=e.message}};window.addEventListener('pagehide',stop);
</script></html>
