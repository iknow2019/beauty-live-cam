<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>뷰티 라이브 캠 v0.3</title><style>body{background:#151622;color:#eee;font:16px system-ui;margin:auto;padding:12px;max-width:720px}h1{font-size:23px}canvas{width:100%;max-height:48vh;object-fit:contain;background:#090910;border-radius:12px}button{background:#363b54;color:white;border:1px solid #777;border-radius:9px;padding:11px;margin:3px}section{background:#24283a;padding:12px;border-radius:12px;margin-top:10px}label{display:flex;align-items:center;gap:8px;margin:12px 0}label span{width:85px}input{flex:1;min-width:0;accent-color:#dc8fcb}output{width:30px;text-align:right}#status{font-size:14px}video{display:none}</style><h1>뷰티 라이브 캠 v0.3</h1><video id="v" autoplay playsinline muted></video><canvas id="out" width="480" height="640"></canvas><div><button id="start">카메라 시작</button><button id="flip">카메라 전환</button><button id="stop">종료</button><button id="photo">사진 저장</button></div><p id="status">카메라 시작을 눌러주세요.</p><section><b>실시간 얼굴 보정</b><div><button data-p="0">원본</button><button data-p="1">자연 보정</button><button data-p="2">여성형</button><button data-p="3">강한 여성형</button></div><div id="controls"></div></section><section><b>마이크 테스트</b><button id="mic">마이크 확인</button><p id="ms">음성 변조 및 방송 연동은 아직 미지원입니다.</p></section><p>얼굴 추적 모델은 외부 CDN에서 내려받습니다. 카메라 영상은 기기 안에서 처리합니다. 얼굴형 보정은 AI 얼굴 교체가 아닌 형태 변형입니다.</p><script type="module">
const $=id=>document.getElementById(id),v=$('v'),out=$('out'),ctx=out.getContext('2d'),base=document.createElement('canvas'),bc=base.getContext('2d',{willReadFrequently:true}),settings={},names={strength:'전체 강도',skin:'피부 보정',jaw:'턱선 축소',eyes:'눈 확대',nose:'코 축소',lip:'입술 색상',blush:'볼 화장',light:'밝기'};for(const [k,n] of Object.entries(names)){let l=document.createElement('label');l.innerHTML=`<span>${n}</span><input type="range" min="0" max="100" value="0"><output>0</output>`;let i=l.querySelector('input'),o=l.querySelector('output');settings[k]=i;i.oninput=()=>o.value=i.value;$('controls').append(l)}const presets=[[0,0,0,0,0,0,0,0],[65,55,15,10,10,12,8,10],[85,70,65,50,45,55,40,12],[100,85,95,80,75,75,65,18]];document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>Object.values(settings).forEach((i,j)=>{i.value=presets[+b.dataset.p][j];i.oninput()}));document.querySelector('[data-p="2"]').click();let stream,face,modelPromise,points,raf=0,facing='user',token=0,last=-1,lastDetect=0;const status=s=>$('status').textContent=s;function model(){return modelPromise??=(async()=>{const {FilesetResolver,FaceLandmarker}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/+esm');const files=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm');return FaceLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task'},runningMode:'VIDEO',numFaces:1})})().catch(e=>{modelPromise=null;throw e})}function stop(){token++;cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null;points=null;last=-1;ctx.clearRect(0,0,out.width,out.height);status('카메라 종료')}async function start(){stop();const t=token;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPS 주소에서 실행해주세요.');const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:640},height:{ideal:480}},audio:false});if(t!==token){s.getTracks().forEach(x=>x.stop());return}stream=s;v.srcObject=s;await v.play();if(t!==token)return;status('카메라 작동 중 · 얼굴 모델 준비 중');raf=requestAnimationFrame(draw);try{face=await model();if(t===token)status('얼굴 인식 준비 완료')}catch(e){if(t===token)status('얼굴 모델 로딩 실패: '+e.message+' / 카메라 시작을 다시 눌러주세요.')}}catch(e){if(t===token)status('카메라 오류: '+e.message)}}
function draw(now){if(!stream)return;raf=requestAnimationFrame(draw);if(v.readyState<2)return;const scale=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight)),w=Math.round(v.videoWidth*scale),h=Math.round(v.videoHeight*scale);if(out.width!==w||out.height!==h){out.width=base.width=w;out.height=base.height=h}bc.setTransform(facing==='user'?-1:1,0,0,1,facing==='user'?w:0,0);bc.drawImage(v,0,0,w,h);bc.setTransform(1,0,0,1,0,0);if(face&&v.currentTime!==last&&now-lastDetect>65){last=v.currentTime;lastDetect=now;try{const p=face.detectForVideo(v,now).faceLandmarks[0];points=p?p.map(q=>({x:(facing==='user'?1-q.x:q.x)*w,y:q.y*h})):null;status(points?'카메라 작동 중 · 얼굴 인식 성공':'얼굴을 화면 중앙에 맞춰주세요.')}catch(e){status('얼굴 인식 오류: '+e.message);points=null}}const a=+settings.strength.value/100,f=k=>+settings[k].value/100*a;ctx.filter=`brightness(${1+f('light')*.4})`;ctx.drawImage(base,0,0);ctx.filter='none';if(!points||!a)return;const p=points,dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2}),fw=dist(p[234],p[454]),fh=dist(p[10],p[152]);if(fw<15)return;const regions=[[mid(p[33],p[133]),fw*.19,fw*.12,-f('eyes')*.42],[mid(p[362],p[263]),fw*.19,fw*.12,-f('eyes')*.42],[p[1],fw*.15,fh*.18,f('nose')*.55],[mid(p[152],p[13]),fw*.59,fh*.32,f('jaw')*.37]];const src=bc.getImageData(0,0,w,h),dst=ctx.getImageData(0,0,w,h),d=dst.data,s=src.data,bright=1+f('light')*.4;for(let y=Math.max(0,Math.floor(p[10].y-fw*.2));y<Math.min(h,p[152].y+fw*.25);y++)for(let x=Math.max(0,Math.floor(Math.min(p[234].x,p[454].x)-fw*.2));x<Math.min(w,Math.max(p[234].x,p[454].x)+fw*.2);x++){let sx=x,sy=y;for(const [c,rx,ry,k] of regions){let dx=sx-c.x,dy=sy-c.y,r=dx*dx/(rx*rx)+dy*dy/(ry*ry);if(r<1){let z=k*(1-r)**2;sx+=dx*z;sy+=dy*z*(c===regions[3][0]?0.12:1)}}let ix=Math.max(0,Math.min(w-1,Math.round(sx))),iy=Math.max(0,Math.min(h-1,Math.round(sy))),j=(iy*w+ix)*4,i=(y*w+x)*4;for(let c=0;c<3;c++)d[i+c]=s[j+c]*bright}ctx.putImageData(dst,0,0);
function ellipse(c,rx,ry,color,alpha){if(rx<1||ry<1)return;ctx.save();ctx.translate(c.x,c.y);ctx.scale(rx,ry);let g=ctx.createRadialGradient(0,0,0,0,0,1);g.addColorStop(0,color);g.addColorStop(1,'transparent');ctx.globalAlpha=alpha;ctx.fillStyle=g;ctx.fillRect(-1,-1,2,2);ctx.restore()}// local skin softening with feathered mask
const smooth=f('skin');if(smooth>0){ctx.save();ctx.beginPath();ctx.ellipse(p[168].x,(p[10].y+p[152].y)/2,fw*.42,fh*.45,0,0,Math.PI*2);ctx.clip();ctx.globalAlpha=smooth*.25;ctx.filter=`blur(${1+smooth*3}px) brightness(${bright})`;ctx.drawImage(base,0,0);ctx.restore()}for(const i of [50,280])ellipse(p[i],fw*.16,fw*.10,'#ef6685',f('blush')*.45);ctx.save();ctx.globalAlpha=f('lip')*.48;ctx.fillStyle='#c84970';ctx.globalCompositeOperation='multiply';ctx.beginPath();[61,40,37,0,267,270,291,321,314,17,84,91].forEach((i,j)=>j?ctx.lineTo(p[i].x,p[i].y):ctx.moveTo(p[i].x,p[i].y));ctx.closePath();ctx.fill();ctx.restore()}
$('start').onclick=start;$('stop').onclick=stop;$('flip').onclick=()=>{facing=facing==='user'?'environment':'user';start()};$('photo').onclick=()=>{if(!stream)return;out.toBlob(b=>{if(!b)return;const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='beauty-'+Date.now()+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)})};$('mic').onclick=async()=>{try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());$('ms').textContent='마이크 접근 성공 (음성 변조 미지원)'}catch(e){$('ms').textContent=e.message}};window.addEventListener('pagehide',stop);
</script></html>
