<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>뷰티 라이브 캠</title><style>body{background:#151622;color:#eee;font:16px system-ui;margin: auto;padding:18px;max-width:720px}video{width:100%;aspect-ratio:4/3;object-fit:contain;background:#090910;border-radius:16px}button{background:#363b54;color:white;border:1px solid #777;border-radius:10px;padding:12px;margin:4px}section{background:#24283a;padding:16px;border-radius:12px;margin-top:12px}label{display:flex;align-items:center;gap:12px;margin:14px 0}input{flex:1;accent-color:#dc8fcb}#status{overflow-wrap:anywhere}</style><h1>뷰티 라이브 캠 v0.2</h1><p>HTTPS 카메라 · 영상 보정 테스트</p><video id="v" autoplay playsinline muted></video><div><button id="start">카메라 시작</button><button id="flip">카메라 전환</button><button id="stop">종료</button><button id="photo">사진 저장</button></div><p id="status">카메라 시작을 눌러주세요.</p><section><b>영상 보정</b><div><button data-p="0">원본</button><button data-p="1">자연스러운 보정</button><button data-p="2">여성풍 색감</button></div><label>밝기<input id="b" type="range" min="70" max="150" value="100"></label><label>색감<input id="s" type="range" min="50" max="160" value="100"></label><label>대비<input id="c" type="range" min="70" max="130" value="100"></label><label>부드러움<input id="r" type="range" min="0" max="2" step="0.1" value="0"></label></section><section><b>마이크 테스트</b><button id="mic">마이크 확인</button><p id="ms">음성 변조는 아직 지원하지 않습니다.</p></section><p>영상과 음성은 서버로 전송하지 않습니다. 얼굴 형태 변환 및 방송 연동은 미구현입니다.</p><script>const $=id=>document.getElementById(id),v=$('v');let stream,facing='user',busy=false;function stop(){stream?.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null}async function start(){if(busy)return;busy=true;stop();try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPS 주소에서 실행하세요.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}},audio:false});v.srcObject=stream;await v.play();$('status').textContent='카메라 작동 중';v.style.transform=facing==='user'?'scaleX(-1)':''}catch(e){stop();$('status').textContent='카메라 오류: '+e.message}finally{busy=false}}$('start').onclick=start;$('flip').onclick=()=>{if(!busy){facing=facing==='user'?'environment':'user';start()}};$('stop').onclick=()=>{if(!busy){stop();$('status').textContent='종료됨'}};function filter(){return `brightness(${$('b').value}%) saturate(${$('s').value}%) contrast(${$('c').value}%) blur(${$('r').value}px)`}function update(){v.style.filter=filter()}for(const id of ['b','s','c','r'])$(id).oninput=update;document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{let p=[[100,100,100,0],[108,105,95,.3],[115,115,90,.6]][+x.dataset.p];['b','s','c','r'].forEach((id,i)=>$(id).value=p[i]);update()});$('photo').onclick=()=>{if(!v.videoWidth)return;let canvas=document.createElement('canvas');canvas.width=v.videoWidth;canvas.height=v.videoHeight;let ctx=canvas.getContext('2d');ctx.filter=filter();if(facing==='user'){ctx.translate(canvas.width,0);ctx.scale(-1,1)}ctx.drawImage(v,0,0);canvas.toBlob(blob=>{if(!blob)return;let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='beauty-photo.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)})};$('mic').onclick=async()=>{let m;try{m=await navigator.mediaDevices.getUserMedia({audio:true});$('ms').textContent='마이크 접근 성공 (음성 변조 미구현)'}catch(e){$('ms').textContent='마이크 오류: '+e.message}finally{m?.getTracks().forEach(t=>t.stop())}};window.addEventListener('pagehide',stop);</script></html>
